name: Verificar projeto
on:
  push:
    branches: [main, feature/platform-backend]
  pull_request:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Impedir credenciais versionadas
        shell: bash
        run: |
          if git grep -I -q -E '(sk-[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' $(git rev-list --all); then
            echo 'Uma possível credencial foi encontrada no histórico.' >&2
            exit 1
          fi
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend lint
      - run: pnpm --dir frontend build
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: woofy
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: woofy_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install './backend[dev,postgres]'
      - run: ruff check backend
      - run: pytest backend -q
      - run: alembic -c backend/alembic.ini upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://woofy:test-only-password@localhost:5432/woofy_test
      - run: alembic -c backend/alembic.ini check
        env:
          DATABASE_URL: postgresql+psycopg://woofy:test-only-password@localhost:5432/woofy_test
      - run: pytest backend -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://woofy:test-only-password@localhost:5432/woofy_test
