name: Verificar projeto
on:
  push:
    branches: [main, feature/platform-backend]
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend lint
      - run: pnpm --dir frontend build
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: woofy
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: woofy_test
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U woofy -d woofy_test'
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install './backend[dev,postgres]'
      - run: ruff check backend
      - run: pytest backend -q
      - run: pytest backend -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://woofy:test-only-password@localhost:5432/woofy_test
      - run: alembic -c backend/alembic.ini upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://woofy:test-only-password@localhost:5432/woofy_test
      - run: alembic -c backend/alembic.ini check
        env:
          DATABASE_URL: postgresql+psycopg://woofy:test-only-password@localhost:5432/woofy_test
