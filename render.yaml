services:
  - type: web
    name: woofy-kau198
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: woofy-database
          property: connectionString
      - key: FRONTEND_ORIGINS
        value: https://kau198.github.io,https://woofy-kau198.onrender.com
      - key: PUBLIC_URL
        value: https://kau198.github.io/Woofy
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: CHAT_DAILY_LIMIT
        value: "40"

databases:
  - name: woofy-database
    plan: free
    databaseName: woofy
    user: woofy
